services:
  portal:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-amu@2026}
      FLASK_SECURE_COOKIES: "0"     # 1 when fronted by HTTPS
      DATABASE_PATH: /data/counselling.db
    volumes:
      - counselling-data:/data
    restart: unless-stopped

volumes:
  counselling-data:
